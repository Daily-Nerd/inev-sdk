name: Release Python SDK

on:
  push:
    tags:
      - 'python/v*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  build:
    name: Build Package
    runs-on: self-hosted
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Extract version
        id: version
        run: |
          # Extract version from tag (python/v0.3.0 -> 0.3.0)
          VERSION=${GITHUB_REF_NAME#python/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          retention-days: 1

  publish-pypi:
    name: Publish to PyPI
    runs-on: self-hosted
    needs: build
    environment: pypi

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses trusted publishing (OIDC)
          # Configure at: https://pypi.org/manage/project/inev-sdk/settings/publishing/
          print-hash: true

  release:
    name: Create Release
    runs-on: self-hosted
    needs: [build, publish-pypi]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#python/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Generate release notes
        run: |
          # Get previous python tag
          PREV_TAG=$(git tag -l 'python/v*' --sort=-version:refname | sed -n '2p')

          echo "## Python SDK v${{ steps.version.outputs.version }}" > release-notes.md
          echo "" >> release-notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "### Changes since ${PREV_TAG}" >> release-notes.md
            echo "" >> release-notes.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" -- src/ tests/ pyproject.toml >> release-notes.md
          else
            echo "### Initial Release" >> release-notes.md
          fi

          echo "" >> release-notes.md
          echo "### Installation" >> release-notes.md
          echo "" >> release-notes.md
          echo "\`\`\`bash" >> release-notes.md
          echo "pip install inev-sdk==${{ steps.version.outputs.version }}" >> release-notes.md
          echo "\`\`\`" >> release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Python SDK v${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
