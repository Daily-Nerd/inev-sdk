name: Release Go SDK

on:
  push:
    tags:
      - 'go/v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          working-directory: go-sdk
          args: --timeout=5m

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          # Extract version from tag (go/v0.1.0 -> v0.1.0)
          VERSION=${GITHUB_REF_NAME#go/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "semver=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          # Get previous go tag
          PREV_TAG=$(git tag -l 'go/v*' --sort=-version:refname | sed -n '2p')

          echo "## Go SDK ${{ steps.version.outputs.version }}" > release-notes.md
          echo "" >> release-notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "### Changes since ${PREV_TAG}" >> release-notes.md
            echo "" >> release-notes.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" -- go-sdk/ >> release-notes.md
          else
            echo "### Initial Release" >> release-notes.md
          fi

          echo "" >> release-notes.md
          echo "### Installation" >> release-notes.md
          echo "" >> release-notes.md
          echo "\`\`\`bash" >> release-notes.md
          echo "go get github.com/Daily-Nerd/inev-sdk-go@${{ steps.version.outputs.version }}" >> release-notes.md
          echo "\`\`\`" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Usage" >> release-notes.md
          echo "" >> release-notes.md
          echo "\`\`\`go" >> release-notes.md
          echo 'import "github.com/Daily-Nerd/inev-sdk-go/client"' >> release-notes.md
          echo 'import inevchi "github.com/Daily-Nerd/inev-sdk-go/integrations/chi"' >> release-notes.md
          echo "\`\`\`" >> release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Go SDK ${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Note: Go modules are automatically available via GitHub tags
      # Users can install with: go get github.com/Daily-Nerd/inev-sdk-go@go/v0.1.0
      # For cleaner versioning, consider using a separate repo or git subtree
