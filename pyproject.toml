[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inev-sdk"
version = "0.1.0"
description = "INEV SDK for domain event capture and Intentionality Leakage Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "INEV", email = "support@inev.io"}
]
keywords = ["inev", "event-tracking", "domain-events", "observability", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
    "Framework :: Django",
    "Framework :: Flask",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.urls]
Repository = "https://github.com/Daily-Nerd/inev-sdk"
Issues = "https://github.com/Daily-Nerd/inev-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
