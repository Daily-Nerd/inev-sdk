[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inev-sdk"
version = "0.2.0"
description = "INEV SDK for domain event capture and Intentionality Leakage Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "INEV", email = "support@inev.io"}
]
keywords = ["inev", "event-tracking", "domain-events", "observability", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
    "Framework :: Django",
    "Framework :: Flask",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.urls]
Repository = "https://github.com/Daily-Nerd/inev-sdk"
Issues = "https://github.com/Daily-Nerd/inev-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pre-commit>=3.5.0",
    "ruff>=0.8.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
]

# =============================================================================
# Ruff configuration
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM102", # nested if statements (sometimes more readable)
    "SIM105", # contextlib.suppress (try-except-pass is clearer for error handling)
    "SIM108", # ternary operator (if-else blocks can be more readable)
    "SIM117", # nested with statements (explicit is better)
]

[tool.ruff.lint.isort]
known-first-party = ["inev_sdk"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "fastapi>=0.127.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
