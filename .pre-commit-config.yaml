repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Python hooks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Go hooks (local - requires Go installed)
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: bash -c 'cd go-sdk && go fmt ./...'
        language: system
        files: \.go$
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: bash -c 'cd go-sdk && go vet ./...'
        language: system
        files: \.go$
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'cd go-sdk && go mod tidy'
        language: system
        files: (\.go$|go\.mod|go\.sum)
        pass_filenames: false

      - id: go-test
        name: go test
        entry: bash -c 'cd go-sdk && go test ./...'
        language: system
        files: \.go$
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd go-sdk && golangci-lint run --config=.golangci.yml'
        language: system
        files: \.go$
        pass_filenames: false
